services:
  # 👇 새로 추가할 DB 서비스
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 입력해주세요}
      - POSTGRES_DB=toporider_db
    ports:
      # [수정] 왼쪽(5401)은 내 컴퓨터용, 오른쪽(5432)은 컨테이너 내부용
      - '127.0.0.1:${DB_PORT:-5401}:5432'
    networks:
      - toporider_net

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8001}:8000'
    depends_on:
      - graphhopper
      - db
    environment:
      - GRAPHHOPPER_URL=http://graphhopper:8989
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL 값을 .env에 입력해주세요}
      - FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID 값을 .env에 입력해주세요}
    networks:
      - toporider_net

  graphhopper:
    build: ./graphhopper
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./graphhopper/config-gh.yml:/graphhopper/config.yml
    environment:
      - JAVA_OPTS=-Xmx2g -Xms2g
    labels:
      # 설정 파일은 볼륨이라 내용이 바뀌어도 컨테이너가 다시 만들어지지 않습니다.
      # deploy.sh가 설정 파일 체크섬을 넘겨, 설정이 바뀐 경우에만 GraphHopper를 다시 시작합니다.
      - trazo.graphhopper-config=${GRAPHHOPPER_CONFIG_SUM:-unknown}
    ports:
      - '127.0.0.1:${GRAPHHOPPER_PORT:-8989}:8989'
    networks:
      - toporider_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY 값을 .env에 입력해주세요}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?VITE_FIREBASE_AUTH_DOMAIN 값을 .env에 입력해주세요}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID 값을 .env에 입력해주세요}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?VITE_FIREBASE_APP_ID 값을 .env에 입력해주세요}
    restart: unless-stopped
    ports:
      - '${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:80' # 호스트의 3000번 포트로 연결
    depends_on:
      - backend
    networks:
      - toporider_net

  # 지도 자동 업데이트 (운영 전용, deploy.sh live에서만 실행)
  # Docker를 제어해야 하므로 docker.sock을 연결합니다. 외부 포트를 열지 않는 별도 컨테이너로 둡니다.
  osm-updater:
    build: ./osm-updater
    profiles: ['osm-updater']
    restart: unless-stopped
    working_dir: ${TRAZO_DIR:-$PWD}
    environment:
      - TRAZO_DIR=${TRAZO_DIR:-$PWD}
      - OSM_CHECK_URL=http://graphhopper:8989
      - OSM_UPDATE_TIME=${OSM_UPDATE_TIME:-04:00}
      - TZ=Asia/Seoul
    volumes:
      # 컨테이너 안에서 실행하는 docker run -v 경로를 호스트가 해석하므로 같은 경로로 연결합니다.
      - ${TRAZO_DIR:-$PWD}:${TRAZO_DIR:-$PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - graphhopper
    networks:
      - toporider_net

volumes: # 맨 아래에 추가
  postgres_data:

networks:
  toporider_net:
    driver: bridge

