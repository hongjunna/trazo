graphhopper:
  # 현재 적용된 지도 파일(south-korea-YYMMDD.osm.pbf)을 가리키는 링크입니다. update-osm.sh가 갱신합니다.
  # 그래프가 이미 있으면 이 파일은 읽지 않으므로, 링크가 바뀌어도 재가공되지 않습니다.
  datareader.file: '/data/south-korea-latest.osm.pbf'
  # 자전거·러닝 프로필에 필요한 속성이 바뀌어 새 그래프를 만듭니다.
  # 새 위치를 사용하면 기존 graph-cache를 지우지 않아도 처음 실행 때 자동으로 다시 가공합니다.
  graph.location: '/data/graph-cache-v2'
  import.osm.ignored_highways: motorway

  # 고도 설정 (CGIAR가 더 안정적입니다)
  graph.elevation.provider: cgiar
  graph.elevation.cache_dir: /data/srtm

  graph.encoded_values: >-
    road_class, road_environment, road_access, surface, max_speed, average_slope, max_slope, roundabout,
    bike_access, bike_priority, bike_average_speed, bike_network,
    foot_access, foot_priority, foot_average_speed, foot_network, hike_rating, mtb_rating

  # 기본 규칙만 프로필에 둡니다. 화면의 경로 옵션은 백엔드가 요청마다 규칙을 덧붙입니다.
  # CH/LM을 쓰지 않아야 요청별 규칙(custom_model)을 적용할 수 있습니다.
  profiles:
    # 자전거: 자전거 통행 가능 도로, 자전거도로·자전거 노선 선호, 자동차 위주 간선도로 회피
    - name: bike
      weighting: custom
      custom_model:
        distance_influence: 70
        priority:
          - { if: '!bike_access && (!backward_bike_access || roundabout)', multiply_by: '0' }
          - { else_if: '!bike_access && backward_bike_access', multiply_by: '0.2' }
          - { else: '', multiply_by: 'bike_priority' }
          - { if: 'road_class == TRUNK', multiply_by: '0.3' }
          - { if: 'road_class == CYCLEWAY || bike_network != MISSING', multiply_by: '1.3' }
        speed:
          - { if: 'true', limit_to: 'bike_average_speed' }
          - { if: '!bike_access && backward_bike_access', limit_to: '5' }

    # 러닝: 보행 가능한 길, 산책로·공원길·걷기 노선 선호, 위험한 산악 구간과 큰 차도 회피
    - name: run
      weighting: custom
      custom_model:
        distance_influence: 70
        priority:
          - { if: '!foot_access || hike_rating >= 3', multiply_by: '0' }
          - { else: '', multiply_by: 'foot_priority' }
          - { if: 'road_class == TRUNK || road_class == PRIMARY', multiply_by: '0.5' }
          - { if: 'foot_network != MISSING', multiply_by: '1.3' }
        speed:
          - { if: 'true', limit_to: 'foot_average_speed' }

server:
  application_connectors:
    - type: http
      port: 8989
  admin_connectors:
    - type: http
      port: 8990
