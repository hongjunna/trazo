server {
    listen 80;
    # TLS가 외부 프록시에서 종료돼도 디렉터리 리디렉션은 HTTPS를 유지합니다.
    absolute_redirect off;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    # 코스 이미지 저장: 카카오 지도 타일 서버는 CORS를 허용하지 않아, 같은 주소로 받아 캔버스에 그립니다.
    # 주소를 요청할 때 찾도록(resolver) 해서, 시작할 때 DNS를 못 찾아도 nginx가 멈추지 않게 합니다.
    location ~ ^/map-tiles/(mts|map)/(.*)$ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $tile_host $1.kakaocdn.net;
        proxy_pass https://$tile_host/$2$is_args$args;
        proxy_set_header Host $tile_host;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        expires 6h;
    }
    # 검색 설정 파일이 없을 때 앱 HTML을 200으로 반환하지 않습니다.
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        try_files $uri =404;
    }
    # 실제로 제공하는 HTML만 앱으로 연결합니다. 임의 URL은 404입니다.
    location = / { rewrite ^ /index.html last; }
    location ~ "^/c/[A-Za-z0-9_-]{6,64}/?$" {
        rewrite ^ /index.html last;
    }
    location / {
        # index.html의 링크 미리보기 태그를 SSI로 채웁니다 (공유 코스 이름, 접속한 도메인).
        ssi on;
        # 백엔드가 응답하지 않아도 페이지에 오류 문구를 넣지 않습니다.
        ssi_silent_errors on;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
    }
}
