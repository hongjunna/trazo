server {
    listen 80;
    # TLS가 외부 프록시에서 종료돼도 디렉터리 리디렉션은 HTTPS를 유지합니다.
    absolute_redirect off;
    server_tokens off;
    # 보안 헤더. location 안에서 add_header를 쓰면 여기 값이 상속되지 않으므로 /admin/에는 따로 적습니다.
    # CSP는 카카오 지도·Firebase·GA 등 외부 스크립트가 많아 아직 넣지 않습니다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # 관리자 페이지 (frontend/admin/index.html). 검색에 노출하지 않고 브라우저에 저장하지 않습니다.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
    }
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    # 코스 이미지 저장: 카카오 지도 타일 서버는 CORS를 허용하지 않아, 같은 주소로 받아 캔버스에 그립니다.
    # 주소를 요청할 때 찾도록(resolver) 해서, 시작할 때 DNS를 못 찾아도 nginx가 멈추지 않게 합니다.
    location ~ ^/map-tiles/(mts|map)/(.*)$ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $tile_host $1.kakaocdn.net;
        proxy_pass https://$tile_host/$2$is_args$args;
        proxy_set_header Host $tile_host;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        expires 6h;
    }
    # 검색 설정 파일이 없을 때 앱 HTML을 200으로 반환하지 않습니다.
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }
    # 일부 검색 봇이 워드프레스식 주소로 사이트맵을 찾습니다.
    location = /sitemap_index.xml { return 301 /sitemap.xml; }
    location = /sitemap.xml {
        proxy_pass http://backend:8000/seo/sitemap.xml;
        proxy_set_header Host $host;
    }
    location ~ "^/sitemap-courses-([0-9]+)\.xml$" {
        rewrite ^/sitemap-courses-([0-9]+)\.xml$ /seo/sitemap-courses/$1.xml break;
        proxy_pass http://backend:8000;
    }
    location = / { rewrite ^ /index.html last; }
    location ~ "^/c/([A-Za-z0-9_-]{6,64})/?$" {
        rewrite "^/c/([A-Za-z0-9_-]{6,64})/?$" /pages/c/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location / {
        # index.html의 링크 미리보기 태그를 SSI로 채웁니다 (공유 코스 이름, 접속한 도메인).
        ssi on;
        # 백엔드가 응답하지 않아도 페이지에 오류 문구를 넣지 않습니다.
        ssi_silent_errors on;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
    }
}
