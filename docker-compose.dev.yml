services:
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
  graphhopper:
    volumes:
      - ./data/dev:/data
      - type: bind
        source: ./data/south-korea-260101.osm.pbf
        target: /data/south-korea-260101.osm.pbf
        read_only: true
        bind:
          create_host_path: false
  frontend:
    build:
      target: development
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 80"
    environment:
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY 값을 .env에 입력해주세요}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?VITE_FIREBASE_AUTH_DOMAIN 값을 .env에 입력해주세요}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID 값을 .env에 입력해주세요}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?VITE_FIREBASE_APP_ID 값을 .env에 입력해주세요}
      DEV_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
volumes:
  frontend_node_modules:
